.stats{display:flex;gap:12px;padding:28px 18px;background:linear-gradient(180deg,#2d2878,var(--p))}

.stats b{display:block;font-size:clamp(34px,9vw,54px);font-weight:800;line-height:1.1}
.stats span{font-size:15px;opacity:.9}
.sl{overflow:hidden;line-height:0;opacity:0;transition:opacity 1s ease}
.sl.in{opacity:1}
.sl img{width:100%;height:auto;transform:scale(calc(var(--z,1)*var(--h,1)));transition:transform .3s ease-out;cursor:zoom-in;will-change:transform}
.sl:hover{--h:1.09}
.call{position:fixed;z-index:60;bottom:18px;left:18px;background:#fff;color:var(--p);padding:14px 20px;border-radius:40px;text-decoration:none;font-weight:800;box-shadow:0 8px 26px rgba(0,0,0,.4)}
.call::before{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid #fff;animation:ping 2s ease-out infinite}
@keyframes ping{to{transform:scale(1.35);opacity:0}}
#lb{position:fixed;inset:0;background:rgba(15,12,50,.95);z-index:100;display:none;overflow:auto;padding:12px;cursor:zoom-out}
#lb.on{display:block}#lb img{width:min(1500px,200%);max-width:none;display:block;margin:auto}

<script>
const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.08});
document.querySelectorAll(".sl").forEach(s=>io.observe(s));
document.querySelectorAll(".stats b").forEach(b=>{new IntersectionObserver((e,o)=>{if(e[0].isIntersecting){o.disconnect();const t=+b.dataset.to,t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/1600);b.textContent=Math.round(t*(1-Math.pow(1-k,3))).toLocaleString("en-US");if(k<1)requestAnimationFrame(f)})(t0)}}).observe(b)});
const bar=document.getElementById("bar"),hi=document.querySelector(".hero img"),sls=[...document.querySelectorAll(".sl")];let tk=0;
function up(){tk=0;const h=document.documentElement;bar.style.width=(scrollY/(h.scrollHeight-innerHeight)*100)+"%";if(scrollY<innerHeight*2)hi.style.translate="0 "+(scrollY*.12)+"px";
sls.forEach(s=>{const r=s.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;const p=(r.top+r.height/2)/innerHeight;s.style.setProperty("--z",(1+.07*(1-Math.min(1,Math.abs(p-.5)*2))).toFixed(3))})}
addEventListener("scroll",()=>{if(!tk)tk=requestAnimationFrame(up)},{passive:true});up();
sls.forEach(s=>s.addEventListener("mousemove",e=>{const r=s.getBoundingClientRect();s.firstChild.style.transformOrigin=((e.clientX-r.left)/r.width*100)+"% "+((e.clientY-r.top)/r.height*100)+"%"}));
const lb=document.getElementById("lb"),li=lb.querySelector("img");
document.addEventListener("click",e=>{const i=e.target.closest(".sl img");if(i){li.src=i.src;lb.classList.add("on")}else if(lb.classList.contains("on"))lb.classList.remove("on")});
</script></body></html>
